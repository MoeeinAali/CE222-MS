# HW5 - Q6 : reverse proxy that sits between the java app and the helper service.
# Mounted at /etc/nginx/nginx.conf (full configuration file, not a snippet).

worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  proxy  '$remote_addr -> $upstream_addr "$request" '
                       'status=$status upstream_status=$upstream_status '
                       'rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  proxy;

    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # docker's embedded DNS, so `helper` is re-resolved if the container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream helper_backend {
        server helper:9090;
        keepalive 16;
    }

    server {
        listen      80;
        server_name _;

        # the only endpoint the java app calls: GET ${HELPER_BASE_URL}/helper
        location = /helper {
            proxy_pass              http://helper_backend/helper;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_connect_timeout   3s;
            proxy_send_timeout      10s;
            proxy_read_timeout      10s;
        }

        # used by the compose healthcheck of this very container
        location = /healthz {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok"}\n';
        }

        location / {
            add_header Content-Type application/json always;
            return 404 '{"error":"not found"}\n';
        }
    }
}
