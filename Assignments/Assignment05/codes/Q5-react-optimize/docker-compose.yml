services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: service-board:optimized
    container_name: service-board
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    # read-only rootfs: nginx only needs writable temp dirs
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
